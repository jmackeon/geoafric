name: GeoAfric CI/CD

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  # ── Run tests on every push/PR ──────────────────────────────────────────
  test:
    name: Test & Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm run test

  # ── Deploy API to Azure App Service (main branch only) ──────────────────
  deploy-api:
    name: Deploy API → Azure
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build and push Docker image
        run: |
          az acr login --name geoafricacr
          docker build -f apps/api/Dockerfile \
            -t geoafricacr.azurecr.io/geoafric-api:${{ github.sha }} \
            -t geoafricacr.azurecr.io/geoafric-api:latest .
          docker push geoafricacr.azurecr.io/geoafric-api:${{ github.sha }}
          docker push geoafricacr.azurecr.io/geoafric-api:latest

      - name: Update Web App to new image
        run: |
          az webapp config container set \
            --name geoafric-api \
            --resource-group geoafric-rg \
            --docker-custom-image-name geoafricacr.azurecr.io/geoafric-api:${{ github.sha }}

      - name: Restart Web App
        run: |
          az webapp restart \
            --name geoafric-api \
            --resource-group geoafric-rg

  # ── Deploy Web to Vercel (main branch only) ─────────────────────────────
  deploy-web:
    name: Deploy Web → Vercel
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Remove stale Vercel configuration
        run: |
          rm -rf .vercel
          rm -rf apps/web/.vercel

      - name: Pull Vercel project settings
        working-directory: ./apps/web
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build web application
        working-directory: ./apps/web
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy web application
        working-directory: ./apps/web
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}